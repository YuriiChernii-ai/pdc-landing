const DOCS={"context":"# Сайт-вхід у Product Design Club\n\n## Проблема\n\nІз 851 людини, яка зайшла в бот клубу, лише 210 хоч раз взяли участь в активності. 169 не дійшли до кінця знайомства.\n\n## Рішення\n\nСайт, який пояснює клуб, показує три кроки долучення й першу малу дію, і веде в Telegram-бот.\n\n## Контекст\n\nProduct Design Club — українське ком’юніті продуктових дизайнерів у Telegram з живими форматами (дизайн-кава, спікінг-клуб) і чатом із фідбеком. Активності: дизайн-кава, Speaking Club, взаємодопомога, спілкування про книги й аніме.\n\n## Для чого сайт\n\n- Нова людина: зрозуміти цінність клубу, зацікавитись і долучитись.\n- Діючий учасник: повертатися за базою знань (матеріали, ШІ-пайплайни) і менторством.\n- Головний акцент: працевлаштування. Знайти першу роботу — те, що найбільше цікавить людей, і сайт має бити в це на кожному кроці.\n\n## Обмеження\n\n- Долучення тільки через бот **@productdesignclub_bot**: Start → знайомство → правила → спільнота. Анкета необов’язкова.\n- Реєстрації на сайті немає. Перед кліком людина має розуміти, що долучення триває в Telegram.\n- Лендінг діючим учасникам нічого не дає: усе, що їм потрібно, вже є в Telegram, тож вони на сайт не повернуться. Причина повертатись — база знань: матеріали, статті, паки елементів і пайплайни роботи з ШІ. Саме ШІ цікавий більшості: 61% учасників.\n- Менторство обрали 30% учасників. Сайт може стати й платформою менторства: каталог менторів і запис на сесію в одному місці.\n","research":"# Дослідження\n\n## Дані клубу\n\nБот клубу, зріз 26.10.2026.\n\n| Показник | Значення |\n|---|---|\n| Зайшли в бот | 851 |\n| Пройшли знайомство | 682 (80%) |\n| Хоч раз брали участь | 210 (25%) |\n| Жодного разу не брали участі | 641 |\n| У Telegram-групі | 488 |\n| Пишуть у чат за тиждень | 71 з 488 |\n\n## Хто в клубі\n\n| | |\n|---|---|\n| Роль | UX/UI 53% · Product 26% · Graphic 9% · інші 12% |\n| Рівень | Junior 36% · Middle 32% · Senior 19% · Student 5% · Lead 4% |\n| Країна | Україна 54% · Польща 10% · інша 15% · не вказано 16% |\n\n## Що їм цікаво\n\n| Тема | Частка |\n|---|---|\n| UX / Product | 66% |\n| Нетворкінг | 65% |\n| AI для дизайнерів | 61% |\n| Пошук роботи | 60% |\n| Події та вебінари | 56% |\n| UI Design | 45% |\n| Портфоліо | 42% |\n| Менторство | 30% |\n\n## Працевлаштування\n\n- Пошук роботи цікавий 60% учасників.\n- Junior і Student разом 41%: їм потрібна перша робота й перший досвід.\n- Перший досвід можна дати через платформу соціальних проєктів.\n\n## Дизайн-кава\n\n- 155 унікальних учасників, 78 повернулись.\n- 86% відповідей: «було чудово» або «було цікаво».\n- З 452 відповідей 414 хочуть тільки пару; фактично 191 пара.\n\n## Конкуренти\n\nНайближчі аналоги — українські Telegram-спільноти без сайтів: t.me/designer_chat, t.me/designhub_skills. Ще Figma Friends Kyiv і IxDF Kyiv/Kharkiv. Великі англомовні: Design Buddies (≈ 100K), Designer Hangout (≈ 18K).\n\n- Спільноти конкурентів поділені на дві частини: інформаційний канал і сама спільнота з чатами. Це варто взяти: інформаційний канал привертає людей, а з нього вони переходять у спільноту.\n- Інформаційний канал можна монетизувати через рекламу.\n- Ніша українського сегмента порожня: сайту, який пояснює клуб і як долучитись, у них немає.\n","problems":"# Ключові проблеми\n\n- Рішення й матеріали губляться в чаті, їх незручно шукати.\n- Людям потрібна перша робота, а в клубі немає шляху, який веде до першого досвіду.\n- Людина заходить у бот, але не знає, що буде далі: 169 не доходять до кінця знайомства.\n- Людина долучається, але не знає, що їй робити: 641 із 851 жодного разу не брали участі.\n- Дизайн-кава подобається, але половина не повертається.\n- Більшість мовчить: пише лише кожен сьомий, а реакцій втричі більше за повідомлення.\n\n## Інсайти\n\n| Факт | Інсайт | Для дизайну |\n|---|---|---|\n| Із 851 участь взяли 210 | вхід працює, перша участь ні | перша мала дія поруч із кнопкою |\n| 169 не дійшли до кінця знайомства | людина не знає, що далі | три кроки біля кнопки |\n| Каву хвалять 86%, повертаються 50% | ритм не очевидний | показати каву як регулярний формат |\n| 414 із 452 хочуть пару | потрібна розмова один на один | «знайомство 1:1» на головній |\n| Пише 71 із 488 | мовчазна більшість присутня | показати «тихі» способи участі |\n| Рішення й матеріали губляться в чаті (спостереження команди клубу) | чат підходить для розмови, не для пошуку | система хештегів у чаті, сторінка бази знань на сайті, окремий інформаційний канал |\n| Пошук роботи цікавий 60%, Junior і Student 41% | головна потреба: перша робота й перший досвід | у кожному блоці сайту є крок до роботи; перший досвід через соцпроєкти |\n| Конкуренти ділять простір на інформаційний канал і спільноту | канал привертає, спільнота утримує, і канал можна монетизувати | інформаційний канал як вхід у клуб |\n","hypotheses":"# Гіпотези\n\n## H1. Перша дія поруч із кнопкою\n\nЯкщо показати найближчу дизайн-каву в банері зверху сайту, то більше долучених візьме участь.\n\nМетрика: частка тих, хто брав участь, зараз 25% (210 із 851).\n\n## H2. Інформаційний канал як вхід\n\nЯкщо відокремити інформаційний канал від чату і вести в ньому новини дизайну та інше корисне, як у конкурентів, то людина спершу підпишеться на канал, а потім перейде в спільноту. Канал можна монетизувати рекламою.\n\nМетрика: частка підписників каналу, що долучились до бота. Зараз каналу немає.\n\n## H3. База знань\n\nЯкщо ввести в чаті систему хештегів і зібрати на окремій сторінці сайту матеріали до найму й після (резюме, портфоліо, тестові), статті, паки елементів і пайплайни роботи з ШІ, то діючі учасники повертатимуться на сайт. ШІ цікавий 61%.\n\nМетрика: частка активних за 30 днів (295), що відкривають базу знань.\n\n## H4. Менторство на платформі\n\nЯкщо додати каталог менторів і запис на сесію, де можна розібрати резюме, портфоліо й підготуватись до співбесіди, то більше учасників скористається менторством. Цікаво 30%.\n\nМетрика: кількість записів на сесію. Зараз платформи немає.\n\n## H5. Кава з дизайнером вищого рівня\n\nЯкщо показати, що дизайн-кава — це розмова з дизайнером вищого рівня, від якої можна забрати інсайти, яких самому не дістати, і показати учасників (імена, позиції Senior, Principal та інші, компанії), то більше людей наважиться на перший раз. Розмова з сильнішим дизайнером також дає орієнтири для пошуку роботи.\n\nГоловне — довести користь такої зустрічі: людина має зрозуміти, що саме вона отримає від розмови.\n\nМетрика: частка тих, хто брав участь, зараз 25% (210 із 851); 641 людина жодного разу не пробувала.\n\n## H6. Вибір рівня на вході\n\nЯкщо спитати роль і рівень і показати відповідні активності, то нова людина швидше візьме участь.\n\nМетрика: частка тих, хто брав участь, зараз 25%.\n\n## H7. Корисні знайомства через соцпроєкти\n\nЯкщо запропонувати спільні соціальні проєкти, то люди знайомитимуться в роботі, а не лише в чаті, і з’являться корисні знайомства.\n\nМетрика: кількість долучених до соцпроєктів. Нетворкінг цікавий 65%.\n","structure":"# Структура головної\n\nПрацевлаштування — наскрізна тема: у кожному блоці є крок до першої роботи.\n\n| # | Блок | Що в ньому | Чому |\n|---|---|---|---|\n| 1 | Банер | Найближча дизайн-кава: дата, спікер, «Записатись» | 641 із 851 жодного разу не брали участі, перша дія має бути на першому екрані |\n| 2 | Hero | Заголовок про клуб і роботу, «Залетіти в групу», «Про ком’юніті», логотипи компаній, де працюють учасники | Пошук роботи цікавий 60%; людина за кілька секунд розуміє, що це за клуб |\n| 3 | Для кого клуб | Ролі: UX/UI, Product, Graphic, ілюстратори, менеджери, розробники | UX/UI 53%, Product 26%, Graphic 9% |\n| 4 | Що отримаєш | Перша робота, фідбек, поради, ментори, воркшопи, матеріали, ШІ, нетворкінг | UX/Product 66%, нетворкінг 65%, ШІ 61%, пошук роботи 60% |\n| 5 | Формати зустрічей | Кава тет-а-тет, дизайн-кава, спікінг-клуб. У каві: учасники з позицією (Senior, Principal) і компанією, що забираєш з розмови, зокрема про роботу | 414 із 452 хочуть пару; перший дотик потребує доведеної користі |\n| 6 | Ментори | Каталог менторів, звернення в приват у Telegram; резюме, портфоліо, співбесіда | Менторство цікаве 30% |\n| 7 | Соцпроєкти | Спільні проєкти, де знайомишся з людьми в роботі; «Запропонувати свою ініціативу» | Нетворкінг цікавий 65% |\n| 8 | Як усе влаштовано в групі | Гілки чату, можна просто читати й реагувати | Пише 71 із 488 |\n| 9 | База знань | Матеріали до найму й після, ШІ-пайплайни, паки елементів, статті, записи воркшопів; пошук за хештегами з чату | Рішення губляться в чаті; база знань дає причину повертатись |\n| 10 | Часті питання | Що буде після Start, як знайти першу роботу через клуб, чи можна просто спостерігати | 169 зупинились у боті |\n| 11 | Телеграм-група й канал | «Перейти в телеграм групу» і підписка на інформаційний канал | Канал як м’який вхід, у конкурентів так само |\n| 12 | Футер | Засновниця, соцмережі | |\n\nНа mobile порядок той самий.\n","flow":"# Сценарії\n\nП’ять сценаріїв на основі блоків, які вже є на сайті.\n\n## Лендос\n\nХто: нова людина, яка ще не в клубі. Ціль: зрозуміти клуб і долучитись.\n\n```mermaid\nflowchart LR\nA[\"Банер: дизайн-кава\"] --> B[\"Hero: Залетіти в групу\"] --> C[\"Для кого клуб\"] --> D[\"Що отримаєш\"] --> E[\"Формати зустрічей\"] --> F[\"Часті питання\"] --> G[\"Телеграм-група\"] --> H[\"Бот: Start, знайомство, правила\"]\n```\n\nМетрика: Start → знайомство (зараз 80%), участь (зараз 25%).\n\n## Пошук ментора\n\nХто: Junior і Middle, яким цікаве менторство (30%). Ціль: знайти ментора й написати йому.\n\n```mermaid\nflowchart LR\nA[\"Меню: Ментори\"] --> B[\"Сторінка менторів: картки\"] --> C[\"Картка: ім'я, роль, компанія\"] --> D[\"Попап: про ментора, відгуки, процес\"] --> E[\"Приват у Telegram\"]\n```\n\nМетрика: кількість звернень до менторів у Telegram.\n\n## База знань\n\nХто: діючий учасник. Ціль: знайти матеріал або ШІ-пайплайн і повертатись.\n\n```mermaid\nflowchart LR\nA[\"Меню: База знань\"] --> B[\"Матеріали від спільноти\"] --> C[\"Фільтр: ШІ, елементи, статті, воркшопи\"] --> D[\"Матеріал\"]\n```\n\nМетрика: частка активних за 30 днів (295), що відкривають базу знань.\n\n## Події\n\nХто: людина, яка ще не брала участі (641 із 851). Ціль: записатись на першу зустріч.\n\n```mermaid\nflowchart LR\nA[\"Банер: наступна дизайн-кава\"] --> B[\"Події: дата, спікер, його позиція й компанія\"] --> C[\"Що забереш з розмови\"] --> D[\"Записатись\"] --> E[\"Нагадування в Telegram\"]\n```\n\nМетрика: частка тих, хто брав участь (зараз 25%).\n\n## Соцпроєкти (ініціатива)\n\nХто: учасники, які хочуть корисних знайомств, і ті, хто має власну ініціативу. Ціль: долучитись до проєкту або запустити свій.\n\n```mermaid\nflowchart LR\nA[\"Меню: Соцпроєкти\"] --> B[\"Список проєктів\"] --> C[\"Проєкт: мета, кого шукають\"] --> D[\"Долучитись у Telegram\"]\nB --> E[\"Запропонувати свою ініціативу\"] --> D\n```\n\nМетрика: кількість долучених до соцпроєктів.\n","interview":"# Питання до користувачів\n\nПитаємо про реальний досвід, не про думку щодо сайту. Кожен блок випливає з метрики бота.\n\n## 169 із 851 не дійшли до кінця знайомства\n\nКому: ті, хто зупинився в боті.\n\n1. Згадайте, як ви зайшли в бот. Що чекали побачити після Start?\n2. На якому кроці ви зупинились? Що саме змусило?\n3. Що б допомогло дійти до кінця?\n\n## 641 із 851 жодного разу не брали участі\n\nКому: учасники групи, які мовчать.\n\n4. Які активності клубу ви знаєте?\n5. Що заважало взяти участь уперше: не знали, формат не підійшов, не було часу?\n6. Що вам дає чат, коли ви в ньому просто читаєте?\n\n## Дизайн-кава: 78 із 155 повернулись, 414 із 452 хочуть пару\n\nКому: учасники першої кави.\n\n7. Розкажіть про вашу першу каву. Що було найкращим?\n8. Чому ви (не) прийшли вдруге? Що б повернуло?\n9. Чому вам важливий формат пари, а не групи?\n\n## ШІ цікавий 61%\n\nКому: діючі учасники.\n\n10. Де ви зараз шукаєте матеріали про ШІ в роботі?\n11. Що з цього хотіли б знаходити в одному місці: пайплайни, паки елементів, статті?\n12. Що змусило б вас повертатися за цим на сайт?\n\n## Пошук роботи 60%, менторство 30%\n\nКому: ті, хто відмітив ці інтереси.\n\n13. Що для вас найскладніше в пошуку першої роботи?\n14. Чого ви чекаєте від клубу в пошуку роботи?\n15. Чи взяли б ви участь у соціальному проєкті заради першого досвіду? Чому так або ні?\n16. Чого ви чекаєте від менторства: формат, ментори, як часто?\n17. Що ви вже пробували, і чому цього не вистачило?\n\n## Пише 71 із 488\n\nКому: учасники, які майже не пишуть.\n\n18. Коли ви востаннє писали в чат? Що зупиняє?\n19. Як ви користуєтесь чатом, якщо не пишете?\n\n## Сайт\n\nКому: нові люди, яких ще немає в клубі.\n\n20. Як ви зазвичай знаходите дизайн-спільноти?\n21. Що вас насторожує в новій спільноті?\n22. Покажіть сторінку: що це за місце? Куди натиснули б? Що станеться далі?\n\n## Завершення\n\n23. Що я забув спитати? З ким ще варто поговорити?\n","deep":"# Каркас глибинного інтерв’ю\n\nКаркас: наповнюємо після перших розмов.\n\n## Мета\n\nЗрозуміти, чому людина не взяла участі або не дійшла до кінця знайомства, і що змусило б її спробувати вперше.\n\n## Кого\n\n| Сегмент | З метрик | Розмов |\n|---|---|---|\n| Не дійшли до кінця знайомства | 169 із 851 | 2 |\n| В групі, але не брали участі | 641 із 851 | 3 |\n| Були на дизайн-каві | 155 учасників | 2 |\n| Активні за 30 днів | 295 | 2 |\n| Нові люди, яких ще немає в клубі | | 2 |\n\n## Формат\n\n30–40 хвилин, відео, запис за згодою. Одна людина, один інтерв’юер, один спостерігач.\n\n## Структура розмови\n\n| Блок | Хвилин | Про що |\n|---|---|---|\n| Вступ | 3 | Мета, запис, «правильних відповідей немає» |\n| Контекст | 5 | Роль, рівень, де шукає розвиток |\n| Шлях у клуб | 8 | Як дізнались, що було після Start, де зупинились |\n| Участь | 8 | Що пробували, що заважало, що дає чат |\n| Кава й менторство | 6 | Перший досвід, що чекали від розмови з сильнішим дизайнером |\n| Сайт | 7 | Показати сторінку без пояснень, коментувати вголос |\n| Завершення | 3 | «Що я забув спитати?», «З ким ще поговорити?» |\n\n## Прийоми\n\n- Питаємо про останній випадок, не про думку.\n- Після відповіді: «Розкажіть докладніше», «Що було далі?».\n- Пауза після відповіді, не підказуємо.\n- Не питаємо «чи скористались би ви…».\n\n## Нотатки\n\n| Цитата або спостереження | Хто | Бар’єр або потреба | Для сайту |\n|---|---|---|---|\n| | сегмент, N | | |\n\n## Після розмов\n\nВписати цитати й бар’єри в таблицю інсайтів, перевірити гіпотези H1–H6.\n","synthesis":"# Синтез глибинного інтерв’ю\n\nПроведено одне глибинне інтерв’ю: я працюю над проєктом сам, часу на більше немає.\n\n## Респондент\n\nJunior, UX/UI, Україна. У групі клубу три місяці, був на одній дизайн-каві, інших активностей не пробував.\n\n## Ключові теми\n\n### Матеріали губляться в чаті\n\n> «Хтось колись скидав гарний пайплайн по ШІ, але знайти його я не можу, чат за день пролітає».\n\n> «Я не пишу в чат, бо боюсь, що питання вже було, а шукати його немає як».\n\nВисновок: чат працює для розмови, не для пошуку. Потрібні хештеги, окрема сторінка бази знань на сайті й окремий інформаційний канал.\n\n### Перша робота й перший досвід\n\n> «Я не знаю, як отримати перший досвід, коли всі вимагають досвіду».\n\nВисновок: перша робота — головна потреба. Перший досвід можна дати через платформу соціальних проєктів.\n\n### Користь кави стає зрозумілою тільки після неї\n\n> «До першої кави я не розумів, що саме винесу. Після неї хотів ще, бо людина показала, як вона будує портфоліо».\n\nВисновок: людину зупиняє невідомість користі, а не формат. Треба показати, хто спікер, яка в нього позиція й компанія, і що забереш з розмови.\n\n### Менторство\n\n> «Мені найцікавіше, щоб хтось подивився моє резюме й портфоліо».\n\n> «Записатись у приват до ментора простіше, ніж через форму».\n\nВисновок: менторство працює як розбір резюме й портфоліо; звернення в приват у Telegram.\n\n## Що це змінює\n\n| Інсайт | Гіпотеза | Що на сайті |\n|---|---|---|\n| Матеріали губляться в чаті | H3 База знань, H2 Інформаційний канал | сторінка бази знань, хештеги, канал |\n| Потрібні корисні знайомства й перший досвід | H7 Корисні знайомства через соцпроєкти | блок і сценарій соцпроєктів |\n| Невідомо, що дасть кава | H5 Кава з дизайнером вищого рівня | учасники з позиціями й компаніями |\n| Менторство як розбір резюме | H4 Менторство | каталог і приват у Telegram |\n","dynamics":"# Динаміка клубу\n\nРіст сповільнюється, а залученість низька. Без змін клуб далі втрачатиме людей.\n\n## Приріст падає\n\nБот клубу, зріз 26.10.2026.\n\n| Показник | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|\n| Приріст групи | +150 | +131 | +117 | +62 |\n| Нові користувачі бота | 351 | 227 | 170 | 103 |\n\nНових людей щоразу менше: приріст групи впав майже втричі.\n\n## Залученість низька\n\n| Показник | Значення |\n|---|---|\n| Хоч раз брали участь | 210 із 851 (25%) |\n| Жодного разу не брали участі | 641 |\n| Активні за 30 днів | 295 із 488 в групі |\n| Пишуть у чат за тиждень | 71 із 488 |\n| Повторна дизайн-кава | 78 із 155 (50%) |\n| Не дійшли до кінця знайомства | 169 |\n\nКлуб тримається на хвилі запуску, а постійної причини повертатись немає.\n\n## Що робимо\n\n1. **База знань, яка оновлюється** з дійсно корисними матеріалами: причина повертатись на сайт.\n2. **Менторська платформа:** менторство цікаве 30%, а розбір резюме й портфоліо відповідає головній потребі, пошуку роботи (60%).\n3. **Інформаційний канал:** новини дизайну й анонси без шуму чату; м’який вхід у клуб.\n4. **Charity** як унікальність формату: клуб, який робить щось корисне. Це припущення, його ще треба перевірити.\n","competitors":"# Аналіз конкурентів\n\n## Хто в полі\n\n| Спільнота | Формат | Що є | Чого немає |\n|---|---|---|---|\n| t.me/designer_chat, t.me/designhub_skills | Telegram-спільноти, українські | чат, окремий інформаційний канал | сайту, який пояснює, як долучитись |\n| Figma Friends Kyiv | локальна спільнота, 1 259 учасників | події, Telegram-чат | бази знань, менторства |\n| IxDF Kyiv/Kharkiv | мітапи | онлайн-мітапи, Telegram і LinkedIn | менторства, постійного контенту |\n| Design Buddies | Discord, ≈ 100K | розсилка: події, вакансії, ментори | українського контексту |\n| Designer Hangout | ≈ 18K, UX | щомісячні Q&A, вакансії | українського контексту |\n\n## Порівняння з PDC\n\n| Можливість | PDC | Telegram-спільноти | Figma Friends, IxDF | Design Buddies, Designer Hangout |\n|---|---|---|---|---|\n| Сайт, що пояснює, як долучитись | так | ні | частково | так |\n| Інформаційний канал окремо від чату | ні | так | ні | розсилка |\n| Живі події | так | ні | так | так |\n| Менторство | так, 7 менторів | ні | ні | так |\n| База знань | матеріали на сайті | ні | ні | ні |\n| Вакансії | ні | ні | ні | так |\n| Українська мова й контекст | так | так | так | ні |\n\n## Що беремо\n\n- **Поділ на інформаційний канал і спільноту:** канал привертає людей, а з нього вони переходять у спільноту; його можна монетизувати.\n- **Розсилка з подіями й вакансіями** (Design Buddies): регулярна причина повертатись.\n- **Щомісячні Q&A** (Designer Hangout): формат із розкладом.\n\n## Прогалина\n\nВ українському сегменті немає сайту, який пояснює клуб, веде в Telegram і дає базу знань та менторство в одному місці.\n","personas":"# Персони\n\nТри персони на основі сегментів клубу й наших сценаріїв.\n\n## Олена, 23, Junior UX/UI, Україна\n\nСегмент: Student і Junior, 41% клубу.\n\n- Шукає першу роботу, портфоліо майже порожнє.\n- Читає чат, але не пише: боїться, що питання вже було.\n- Сценарії: Лендос, Пошук ментора, Соцпроєкти.\n\n> Потрібно: перший досвід і хтось, хто подивиться портфоліо.\n\n## Андрій, 29, Middle Product, Польща\n\nСегмент: Middle, 32% клубу.\n\n- Працює, розвивається: цікавлять ШІ й нетворкінг.\n- У чаті пише рідко, часу гортати немає.\n- Сценарії: База знань, Події.\n\n> Потрібно: знаходити корисне швидко, без гортання чату.\n\n## Марина, 36, Senior Product, Україна\n\nСегмент: Senior, 19% клубу.\n\n- Хоче ділитись досвідом, але не бачить, що клуб дає їй.\n- Може бути ментором або спікером дизайн-кави.\n- Сценарії: Пошук ментора (як ментор), Соцпроєкти (ініціатива), Події.\n\n> Потрібно: зрозуміти, навіщо їй клуб і де її внесок.\n","jtbd":"# JTBD\n\nНа основі CJM і сценаріїв: історії користувача, рішення на сайті й крайні випадки.\n\n| Етап | ID | Історія користувача | Рішення на сайті | Крайні випадки |\n|---|---|---|---|---|\n| Знайомство | A1 | **Зрозуміти клуб.** Коли я шукаю дизайн-спільноту, я хочу за кілька секунд зрозуміти, що це за клуб і для кого, щоб не втрачати час | Hero із заголовком, логотипи компаній учасників, блок «Для кого клуб» | Людина з суміжної ролі: у «Для кого клуб» вказані ілюстратори, менеджери, розробники |\n| | A2 | **Знати, що далі.** Коли я тисну «Залетіти в групу», я хочу розуміти, що долучення триває в Telegram, щоб не боятись невідомого | Біля кнопки: бот @productdesignclub_bot, анкета необов’язкова, реєстрації на сайті немає | Telegram не встановлено: показати посилання на встановлення |\n| | A3 | **Довіряти клубу.** Коли я вагаюсь, я хочу бачити, хто в клубі й де працює, щоб довіряти | Логотипи компаній, ментори, відгуки | Компанію не можна показувати: вказати лише позицію |\n| Події | B1 | **Не пропустити подію.** Коли в клубі є зустріч, я хочу знати тему, хто виступає й що буде, щоб вирішити, чи йти | Банер із найближчою кавою і сторінка події: дата, час із часовим поясом, тема, спікер (позиція, компанія), програма, «Записатись» | Подію перенесено або скасовано: оновити банер і написати в інформаційному каналі. Учасник з Польщі: час показується з поясом |\n| | B2 | **Не забути.** Коли я записався, я хочу отримати нагадування, щоб прийти | Нагадування в Telegram до зустрічі | Не можу прийти: запис зустрічі лишається в базі знань |\n| | B3 | **Побачити користь.** Коли я вибираю зустріч, я хочу бачити, що забираю з розмови з сильнішим дизайнером, щоб наважитись на перший раз | Профіль спікера: позиція, компанія, теми, що забереш | Спікера ще немає: показати формат кави тет-а-тет |\n| База знань | C1 | **Швидко знайти рішення.** Коли мені потрібне рішення або ШІ-пайплайн, я хочу швидко його знайти, а не гортати чат | Сторінка бази знань, фільтри за темою, пошук за хештегами з чату | Нічого не знайдено: показати схожі матеріали й запропонувати спитати в чаті |\n| | C2 | **Бачити нове.** Коли я повертаюсь, я хочу бачити нові матеріали, щоб не перечитувати старе | Стрічка «Нове» і дата оновлення на кожному матеріалі | База давно не оновлювалась: показати найпопулярніше за місяць |\n| Менторство | D1 | **Знайти ментора.** Коли в мене слабке портфоліо, я хочу, щоб досвідчена людина розібрала його, щоб рости далі | Каталог менторів, картка з попапом (про ментора, відгуки, процес), кнопка «Написати в Telegram» | Ментор не відповідає: показати інших менторів зі схожою спеціалізацією |\n| | D2 | **Стати ментором.** Коли я хочу ділитись досвідом, я хочу простий спосіб це зробити, щоб допомогти іншим | Кнопка «Стати ментором», веде в приват у Telegram | Не готовий до регулярності: запропонувати стати спікером кави |\n| Повернення | E1 | **Бути в курсі.** Коли мене немає в чаті, я хочу отримувати важливе без гортання, щоб нічого не пропустити | Інформаційний канал: анонси подій, нові матеріали | Забагато повідомлень: тільки важливе, раз на тиждень дайджест |\n","cjm":"# CJM\n\nОлена, Junior UX/UI, шукає першу роботу.\n\n| Етап | Дія | Думка | Біль | Що робимо |\n|---|---|---|---|---|\n| Дізнається | Бачить пост про клуб | Це для мене? | Не зрозуміло, що це дасть | Hero з поясненням і логотипами компаній |\n| Заходить | Відкриває сайт | Чи є тут моя тема? | Багато інформації | Банер із кавою, блок «Для кого клуб» |\n| Долучається | Тисне «Залетіти в групу», Start у боті | Що далі? | 169 із 851 не дійшли до кінця знайомства | Пояснення перед кліком, що долучення в Telegram |\n| Перша дія | Читає чат, думає про каву | Страшно писати | 641 із 851 жодного разу не брали участі | Дизайн-кава з видимим спікером, позицією й користю |\n| Шукає матеріали | Гортає чат | Де це було? | Рішення губляться | База знань із хештегами |\n| Хоче роботу | Дивиться менторів | Хто подивиться моє портфоліо? | Немає єдиного місця | Каталог менторів, приват у Telegram |\n| Знайомиться | Долучається до соцпроєкту | Нарешті можна познайомитись у роботі | У чаті складно познайомитись | Платформа соцпроєктів |\n| Повертається | Читає інформаційний канал | Тут завжди є що почитати | Приріст падає, залученість низька | Інформаційний канал і база знань, що оновлюється |\n","summary":"# Підсумок\n\n| Пункт | Коротко |\n|---|---|\n| Проблема й рішення | Із 851 людини в боті участь взяли 210. Сайт пояснює клуб і веде в Telegram |\n| Дослідження | Клуб: UX/UI 53%, Junior і Student 41%, Україна 54%. Цікавить UX/Product 66%, нетворкінг 65%, ШІ 61%, пошук роботи 60% |\n| Динаміка клубу | Приріст групи впав із +150 до +62. Участь 25%, 641 людина жодного разу не брала участі |\n| Аналіз конкурентів | В Україні немає сайту, що пояснює клуб. Беремо поділ на інформаційний канал і спільноту |\n| Ключові проблеми | Матеріали губляться в чаті, немає причини повертатись, невідомо, що дасть участь |\n| Персони | Олена (Junior), Андрій (Middle), Марина (Senior) |\n| JTBD | Зрозуміти клуб, не пропустити подію, знайти матеріал, знайти ментора, бути в курсі |\n| CJM | Від «дізнається» до «повертається»: болі на кроках знайомства, першої дії й пошуку матеріалів |\n| Гіпотези | Сім: перша дія, інформаційний канал, база знань, менторство, кава з сильнішим дизайнером, вибір рівня, соцпроєкти |\n| Інтерв’ю | Одне глибинне: матеріали губляться, користь кави стає зрозумілою після неї, менторство як розбір резюме |\n| Структура головної | 12 блоків: банер із кавою, hero, для кого, що отримаєш, формати, ментори, соцпроєкти, група, база знань, FAQ, телеграм і канал, футер |\n| Сценарії | П’ять: Лендос, Пошук ментора, База знань, Події, Соцпроєкти |\n\n## Що робимо\n\n1. База знань, яка оновлюється: причина повертатись.\n2. Менторська платформа з зверненням у приват у Telegram.\n3. Інформаційний канал: м’який вхід у клуб.\n4. Соцпроєкти для корисних знайомств.\n5. Charity як можлива унікальність формату, ще не перевірено.\n"};
const flat=NAV.flatMap(g=>g.items);
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
if(window.mermaid)mermaid.initialize({startOnLoad:false,theme:dark?'dark':'neutral',securityLevel:'loose',flowchart:{htmlLabels:true}});
document.getElementById('nav').innerHTML=NAV.map(g=>'<h2>'+g.group+'</h2>'+g.items.map(i=>'<a href="#'+i.id+'" data-id="'+i.id+'">'+i.title+'</a>').join('')).join('');
async function show(){
  const id=(location.hash||'').slice(1)||flat[0].id;const d=DOCS[id]?id:flat[0].id;
  document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.id===d));
  let md=DOCS[d];
  const html=marked.parse(md,{gfm:true,breaks:false});
  const el=document.getElementById('doc');
  el.innerHTML=html;
  el.querySelectorAll('pre > code.language-mermaid').forEach(c=>{const div=document.createElement('div');div.className='mermaid';div.textContent=c.textContent;c.parentElement.replaceWith(div);});
  el.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t);});
  const i=flat.findIndex(x=>x.id===d);
  el.insertAdjacentHTML('beforeend','<div class="pager">'+(i>0?'<a href="#'+flat[i-1].id+'">← '+flat[i-1].title+'</a>':'<span></span>')+(i<flat.length-1?'<a href="#'+flat[i+1].id+'">'+flat[i+1].title+' →</a>':'<span></span>')+'</div>');
  document.title=flat[i].title+' · UX-артефакти PDC';
  window.scrollTo(0,0);
  if(window.mermaid){try{await mermaid.run({querySelector:'.mermaid'});}catch(e){console.error(e)}}
}
addEventListener('hashchange',show);
show();
</script>
